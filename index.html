 else if(kind==="tp"){const t=editT(+a[0]),p=t.pos[+a[1]],fl=a[2];if(fl==="a")p.a=v.split(",").map(x=>x.trim()).filter(Boolean);else if(fl==="c")p.c=v;else if(fl==="m")p.m=v;else if(fl==="bn")p.b[0]=Math.max(0,parseInt(v)||0);else if(fl==="bt")p.b[1]=v;}
 else if(kind==="shots"){S.shotsOv[a[0]]=String(v).split("\n").map(x=>x.trim()).filter(Boolean);}
 else if(kind==="tcible"){const t=editT(+a[0]);t.cible=t.cible||{};t.cible[a.slice(1).join(":")]=v;}
 else if(kind==="tplace"){const t=editT(+a[0]);t.place=t.place||{};t.place[a.slice(1).join(":")]=v;}
 else if(kind==="trep"){const t=editT(+a[0]);t.rep=t.rep||{};t.rep[a[1]]=(v===""?null:Number(v));}
 else if(kind==="rep"){S.rep[a[0]]=(v===""?null:Number(v));}
 else if(kind==="gen"){S.gen[a[0]]=v;}
 else if(kind==="pw"){if(String(v).length>=4)await setPw(a[0],String(v));else toast("4 caractères minimum.");}
 if(kind!=="sel")S.dirty=true;
 render();
}

function checks(){
 const out=[],E=m=>out.push(["err",m]),W=m=>out.push(["warn",m]);let prev=-1;
 T.forEach(t=>{const n=t.n,P=`Tableau ${n}`;
  const h=parseH(t.h);if(h===null)E(`${P} : heure invalide (${t.h}).`);else{if(h<=prev)E(`${P} : l'heure ${t.h} n'est pas après le tableau précédent.`);prev=h;}
  const ps=t.pos.map(p=>p.p);if(ps.some((p,i)=>p!==i+1))E(`${P} : les podiums ne sont pas numérotés de 1 à ${ps.length}.`);
  if(t.pos.length<4)E(`${P} : moins de 4 podiums.`);
  const names=t.pos.flatMap(p=>p.a),dup=names.filter((x,i)=>names.indexOf(x)!==i);if(dup.length)E(`${P} : artiste en double (${[...new Set(dup)].join(", ")}).`);
  t.pos.forEach(p=>{if(!p.a.length)E(`${P}, podium ${p.p} : aucun artiste.`);if(!String(p.c||"").trim())W(`${P}, podium ${p.p} : costume vide.`);});
  const sl=slots(n),who=sl.map(s=>ga(n,s));
  const dsq=who.filter((x,i)=>who.indexOf(x)!==i);if(dsq.length)E(`${P} : écuyer affecté deux fois (${[...new Set(dsq)].join(", ")}).`);
  who.forEach((x,i)=>{if(!SQ.includes(x))E(`${P} : « ${x} » n'est pas un écuyer (${slotLabel(sl[i])}).`);});
  const mis=SQ.filter(x=>!who.includes(x));if(mis.length)W(`${P} : écuyer sans mission (${mis.join(", ")}).`);
  const cr=carry(n);[1,2,3,4,5].forEach(p=>{const q=t.pos.find(x=>x.p===p);if(q&&q.b[0]>0&&!Object.values(cr).some(a=>a.some(x=>x.pod===p)))E(`${P}, podium ${p} : cotillons sans écuyer porteur.`);});
  const tot=t.pos.reduce((a,p)=>a+p.b[0],0),pl=(POOL[n]||[]).reduce((a,x)=>a+x[1],0);if(POOL[n]&&tot!==pl)W(`${P} : ${tot} cotillons pour une répartition de tailles prévue pour ${pl}.`);
  if(!t.dj.length)E(`${P} : aucun DJ.`);
  t.dj.forEach(d=>{if(!DJS.includes(d))E(`${P} : DJ « ${d} » inconnu.`);});
 });
 const tot={argent:0,rose:0,rainbow:0};T.forEach(t=>t.pos.forEach(p=>{tot[p.b[1]]=(tot[p.b[1]]||0)+p.b[0];}));
 Object.keys(tot).forEach(k=>{const st=(STOCK[k]||[]).reduce((a,x)=>a+x[1],0);if(tot[k]>st)E(`Stock de cotillons ${k} insuffisant : besoin ${tot[k]}, stock ${st}.`);});
 ROLES.flatMap(g=>g[1]).forEach(r=>T.forEach(t=>{try{const c=ctx(r,t);if(!c.off)relSteps(c).forEach(k=>{if(/undefined|NaN|\[object/.test(String(c.st[k].d)))E(`${roleLabel(r)} · T${t.n} · ${stT(k)} : texte invalide.`);});}catch(e){E(`${roleLabel(r)} · T${t.n} : erreur (${e.message}).`);}}));
 T.forEach(t=>{const seen={};MEDIA.forEach(m=>{const a=String((t.place||{})[m]||"").trim().toLowerCase();if(!a||a===TBV.toLowerCase())return;(seen[a]=seen[a]||[]).push(m);});Object.keys(seen).forEach(a=>{if(seen[a].length>1)W(`Tableau ${t.n} : même angle « ${a} » pour ${seen[a].join(" et ")}.`);});});
 const nt=tbvItems().length;if(nt)W(`${nt} éléments restent à valider.`);

const WEB=!window.claude&&/^https?:$/.test(location.protocol);
/* ============ MODE WEB (GitHub Pages) : mise à jour automatique en ligne, copie locale hors ligne ============ */
const GHK="bdl-gh";
const ghRead=()=>{try{return JSON.parse(localStorage.getItem(GHK)||"{}");}catch(e){return {};}};
const getTok=()=>ghRead().tok||"";
function ghInfo(){const s=ghRead();if(s.owner&&s.repo)return {owner:s.owner,repo:s.repo};
 const m=/^([^.]+)\.github\.io$/.exec(location.hostname),p=location.pathname.split("/").filter(Boolean);
 return {owner:m?m[1]:"",repo:m?(p[0]||m[1]+".github.io"):""};}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function ghApi(method,body,path){
 const g=ghInfo(),t=getTok();if(!t||!g.owner||!g.repo)throw new Error("jeton ou dépôt manquant");
 const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path||"config.json"}`,{method,headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 return r;}
async function ghPublish(x){
 const g=await ghApi("GET");let sha;
 if(g.status===200){sha=(await g.json()).sha;}else if(g.status!==404){throw new Error(g.status===401||g.status===403?"jeton refusé (droits Contents : Read and write ?)":"GitHub "+g.status);}
 const p=await ghApi("PUT",{message:`Publication v${x.v}`,content:b64(JSON.stringify(x)),sha});
 if(!p.ok)throw new Error(p.status===409?"conflit, réessaie":p.status===401||p.status===403?"jeton refusé":"GitHub "+p.status);
}
const u8=b=>btoa(String.fromCharCode(...new Uint8Array(b))),fb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pkKey(code,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:300000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function pkEnc(code,tok){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pkKey(code,s),new TextEncoder().encode(tok));return {s:u8(s),iv:u8(iv),c:u8(c)};}
async function pkDec(code,o){const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:fb(o.iv)},await pkKey(code,fb(o.s)),fb(o.c));return new TextDecoder().decode(p);}
async function pkFetch(){const g=ghInfo(),r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/pk.json`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
 if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);const j=await r.json();return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,"")))));}
